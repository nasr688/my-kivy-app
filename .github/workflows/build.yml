name: Build Kivy Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK using Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev tar bzip2 gzip unzip make gettext zip libssl-dev autoconf automake libtool patch openssl python3-pip
          sudo apt-get install -y libsqlite3-dev sqlite3 autotools-dev
          sudo apt-get install -y uuid-dev openjdk-17-jdk cmake ccache
          pip3 install --user --upgrade buildozer Cython virtualenv

      # التعديل القوي: الموافقة الإجبارية والمباشرة على جميع تراخيص أندرويد
      - name: Auto Accept Android Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          if [ -d "$ANDROID_HOME/tools/bin" ]; then
            yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
          fi

      # التعديل التقني: تشغيل البناء وحفظ السجل الضخم في ملف نصي خارجي لمنع التعليق
      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          yes | buildozer -v android debug > buildozer_full_log.txt 2>&1

      # التعديل السحري: إذا فشل البناء، هذا الأمر يستخرج آخر 100 سطر (المشكلة الحقيقية) في ملف مستقل
      - name: Extract Error Log if Failed
        if: failure()
        run: |
          echo "=== EXTRACTING LAST 100 LINES OF LOG ==="
          tail -n 100 buildozer_full_log.txt > build_error_only.txt
          cat build_error_only.txt

      # رفع ملف الخطأ الصغير والملف الكامل كـ Artifacts لتقرأ المشكلة بوضوح
      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            build_error_only.txt
            buildozer_full_log.txt

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kivy-debug-apk
          path: bin/*.apk
